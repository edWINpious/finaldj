# Team compose: web decoy + database honeypot + collector + dashboard.
#
#   cp .env.example .env        (then set the passwords)
#   docker compose up --build -d
#   docker compose --profile attacker up -d db-attacker
#
# The SSH decoy and the simulator join later on lab_net (simulator fixed IP 172.28.0.50).
# Stop the standalone docker-compose.web.yml stack first: both use subnet 172.28.0.0/16.
#
# Network paths, which are the isolation design (services/database/README.md):
#   lab_net      attacker -> decoys. Attackers live here and can reach nothing else.
#   db_mgmt_net  sensor -> MariaDB (controller account). No attacker on this network.
#   ingest_net   sensors -> collector. The database container is NOT on it.
#   soc_edge     dashboard -> collector, and host ports bound to 127.0.0.1.
name: soc-lab

services:
  database-honeypot:
    build: ./services/database
    image: transnova-db-honeypot:dev
    container_name: database-honeypot
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD:?set in .env}
      MARIADB_DATABASE: transnova_logistics
      DECOY_DB_PASSWORD: ${DECOY_DB_PASSWORD:?set in .env}
      CONTROLLER_DB_PASSWORD: ${CONTROLLER_DB_PASSWORD:?set in .env}
      CONTROLLER_HOST: 172.29.0.21
      TZ: UTC
    volumes:
      - db-data:/var/lib/mysql
      - db-logs:/var/log/mysql
    cap_drop: [ALL]
    cap_add: [CHOWN, SETUID, SETGID, DAC_OVERRIDE, FOWNER]
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    mem_limit: 768m
    networks:
      lab_net:
        ipv4_address: 172.28.0.30
      db_mgmt_net:
        ipv4_address: 172.29.0.20
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s

  db-sensor:
    build: ./services/database/sensor
    image: transnova-db-sensor:dev
    container_name: db-sensor
    restart: unless-stopped
    depends_on:
      database-honeypot:
        condition: service_healthy
    environment:
      SENSOR_ID: db-01
      AUDIT_LOG_PATH: /var/log/mysql/server_audit.log
      SENSOR_DATA_DIR: /data
      COLLECTOR_BASE_URL: http://collector:8000
      DB_HOST: 172.29.0.20
      DB_PORT: "3306"
      DB_DESTINATION_IP: 172.28.0.30
      CONTROLLER_DB_PASSWORD: ${CONTROLLER_DB_PASSWORD:?set in .env}
      INTERNAL_ACCOUNTS: deception_ctrl@172.29.0.21
    volumes:
      - db-logs:/var/log/mysql:ro
      - db-sensor-data:/data
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    pids_limit: 64
    mem_limit: 256m
    networks:
      db_mgmt_net:
        ipv4_address: 172.29.0.21
      ingest_net:
        ipv4_address: 172.30.0.21

  web-decoy:
    build: ./services/web
    image: halden-web-decoy:dev
    restart: unless-stopped
    environment:
      COLLECTOR_URL: http://collector:8000/api/events
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    volumes:
      - web-data:/data
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    mem_limit: 256m
    networks:
      lab_net:
        ipv4_address: 172.28.0.10
      ingest_net:
        ipv4_address: 172.30.0.10
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8080/health',timeout=2).status==200 else 1)"]
      interval: 10s
      timeout: 3s
      retries: 3

  collector:
    build:
      context: .
      dockerfile: collector/Dockerfile
    image: soc-collector:dev
    container_name: collector
    restart: unless-stopped
    volumes:
      - collector-data:/data
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    ports:
      - "127.0.0.1:8000:8000"
    networks:
      ingest_net:
        ipv4_address: 172.30.0.20
      soc_edge: {}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health',timeout=2).status==200 else 1)"]
      interval: 10s
      timeout: 3s
      retries: 3

  dashboard:
    build:
      context: .
      dockerfile: dashboard/Dockerfile
    image: soc-dashboard:dev
    container_name: dashboard
    restart: unless-stopped
    depends_on:
      collector:
        condition: service_healthy
    environment:
      COLLECTOR_BASE_URL: http://collector:8000
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    ports:
      - "127.0.0.1:8501:8501"
    networks:
      soc_edge: {}

  # Independent attacker: a genuine MariaDB client on lab_net only.
  #   docker compose exec db-attacker mariadb -h database-honeypot -u decoy_user -p transnova_logistics
  db-attacker:
    image: mariadb:11.4.9
    container_name: db-attacker
    profiles: [attacker]
    command: ["sleep", "infinity"]
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    networks:
      lab_net:
        ipv4_address: 172.28.0.51

networks:
  lab_net:
    internal: true
    driver_opts:
      com.docker.network.bridge.inhibit_ipv4: "true"
    ipam:
      config:
        - subnet: 172.28.0.0/16
  db_mgmt_net:
    internal: true
    driver_opts:
      com.docker.network.bridge.inhibit_ipv4: "true"
    ipam:
      config:
        - subnet: 172.29.0.0/24
  ingest_net:
    internal: true
    driver_opts:
      com.docker.network.bridge.inhibit_ipv4: "true"
    ipam:
      config:
        - subnet: 172.30.0.0/24
  soc_edge: {}

volumes:
  db-data:
  db-logs:
  db-sensor-data:
  web-data:
  collector-data:
